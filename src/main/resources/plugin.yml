name: DreamTPA
version: '${version}'
main: com.liuchangking.dreamtpa.DreamTPA
depend: [DreamEngine]
api-version: 1.18
commands:
  dreamtpa:
    description: Open TPA menu or send teleport request
    aliases: [tpa]
  tpaccept:
    description: Accept teleport request
  tpdeny:
    description: Deny teleport request
permissions:
  dreamtpa.admin:
    description: Allows reloading DreamTPA MySQL configuration
    default: op
